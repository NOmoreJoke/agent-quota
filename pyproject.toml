[build-system]
requires = ["hatchling==1.27.0"]
build-backend = "hatchling.build"

[project]
name = "agent-quota-core"
version = "0.1.0"
description = "Local-first quota aggregation core for Agent Quota Desktop"
readme = "README.md"
requires-python = ">=3.11,<3.12"
license = { text = "MIT" }
authors = [{ name = "Agent Quota contributors" }]
dependencies = []

[project.urls]
Repository = "https://github.com/NOmoreJoke/agent-quota"
Issues = "https://github.com/NOmoreJoke/agent-quota/issues"

[project.scripts]
agent-quota = "agent_quota.cli:main"
agent-quota-sidecar = "agent_quota.sidecar:main"

[dependency-groups]
dev = [
  "build==1.3.0",
  "hypothesis==6.136.6",
  "mypy==1.17.1",
  "pytest==8.4.1",
  "pytest-cov==6.2.1",
  "ruff==0.12.7",
]
package = [
  "pyinstaller==6.21.0",
]

[tool.hatch.build.targets.wheel]
packages = ["src/agent_quota"]

[tool.hatch.build.targets.sdist]
include = [
  "/src",
  "/tests",
  "/tools",
  "/README.md",
  "/LICENSE",
  "/ASSET_PROVENANCE.md",
  "/THIRD_PARTY_NOTICES.md",
  "/THIRD_PARTY_LICENSE_CORPUS.json",
  "/THIRD_PARTY_UPSTREAM_LICENSE_SOURCES.json",
  "/pyproject.toml",
  "/uv.lock",
]

[tool.pytest.ini_options]
addopts = "-ra --strict-markers --strict-config"
testpaths = ["tests"]

[tool.coverage.run]
branch = true
source = ["agent_quota"]

[tool.coverage.report]
fail_under = 90
show_missing = true

[tool.mypy]
python_version = "3.11"
strict = true
packages = ["agent_quota", "agent_quota_testkit"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "RUF"]

[tool.ruff.format]
quote-style = "double"
