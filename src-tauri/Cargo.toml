[package]
name = "agent-quota-desktop"
version = "0.1.0"
description = "Local quota control desktop host"
authors = ["Agent Quota"]
edition = "2024"
rust-version = "1.85"

[features]
default = []
production = []
development-overrides = []

[lib]
name = "agent_quota_desktop_lib"
crate-type = ["lib", "cdylib", "staticlib"]

[build-dependencies]
tauri-build = { version = "=2.6.3", features = [] }

[dependencies]
hmac = "=0.12.1"
libc = "=0.2.189"
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.151"
sha2 = "=0.10.9"
tauri = { version = "=2.11.5", features = [] }
thiserror = "=2.0.19"

[dev-dependencies]
tempfile = "=3.23.0"
